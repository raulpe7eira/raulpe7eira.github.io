name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      # Erlang and Elixir from mise.toml (precompiled builds on Ubuntu runners)
      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - run: mix format --check-formatted
      - run: mix credo
      - run: mix gettext.extract --check-up-to-date
      - run: mix deps.audit

      - name: Tests with coverage (posted to Coveralls)
        run: mix coveralls.github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generated pages are up to date
        run: |
          mix site.build --no-pdf
          git diff --exit-code docs/

      - name: No broken references in docs/
        run: mix site.check
